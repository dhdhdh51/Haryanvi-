# =====================================================================
#  Haryanvi AI — nginx rules for aaPanel / BT Panel
# ---------------------------------------------------------------------
#  WHY THIS FILE EXISTS
#  The backend ships .htaccess files, which Apache reads and nginx
#  ignores completely. On a default aaPanel site (nginx) that means:
#    * /api/* returns 404, because nothing rewrites it to index.php;
#    * database/*.sql and storage/logs/*.log are downloadable.
#  These rules replace the .htaccess behaviour.
#
#  HOW TO INSTALL
#  aaPanel → Website → your site → URL Rewrite, paste everything below,
#  Save. aaPanel writes it to
#      /www/server/panel/vhost/rewrite/<your-domain>.conf
#  and includes it inside the server block, so no `server { }` wrapper
#  belongs here.
#
#  Then: Website → your site → Config File, and confirm the PHP version
#  socket matches your install (aaPanel inserts this automatically).
# =====================================================================

# ---------------------------------------------------------------------
#  1. Deny the directories that must never be served
# ---------------------------------------------------------------------
# Order matters: these come before the PHP handler so that a .php file
# inside them is refused rather than executed.
location ~ ^/(config|src|database|storage|bin|tests)/ {
    deny all;
    return 403;
}

# Admin view templates are includes, not pages.
location ~ ^/admin/views/ {
    deny all;
    return 403;
}

# Dumps, logs, docs and lock files.
location ~* \.(sql|log|md|example|bak|ini|lock|yml|yaml)$ {
    deny all;
    return 403;
}

# Dotfiles, including the now-inert .htaccess files themselves.
location ~ /\. {
    deny all;
    return 403;
}

# ---------------------------------------------------------------------
#  2. Route the API through the front controller
# ---------------------------------------------------------------------
# index.php derives the route from REQUEST_URI, so a single rewrite is
# all that is needed.
location /api/ {
    try_files $uri /index.php$is_args$args;
}

# ---------------------------------------------------------------------
#  3. Admin dashboard
# ---------------------------------------------------------------------
location = /admin {
    return 301 /admin/;
}

location /admin/ {
    try_files $uri $uri/ /admin/index.php$is_args$args;
}

# ---------------------------------------------------------------------
#  4. Security headers
#     (the API sets its own per-response; these cover static files and
#      act as a backstop)
# ---------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Remove the PHP version banner.
fastcgi_hide_header X-Powered-By;

# ---------------------------------------------------------------------
#  5. Request size cap
#     The API rejects bodies over 64 KB itself; stopping them at the
#     edge saves a PHP worker.
# ---------------------------------------------------------------------
client_max_body_size 1m;

# ---------------------------------------------------------------------
#  NOTE ON THE Authorization HEADER
#  nginx + PHP-FPM passes it through fastcgi_params on aaPanel, so
#  bearer auth works unchanged. If every request comes back
#  UNAUTHORIZED with a valid token, add this inside the location that
#  handles .php in the site's Config File:
#
#      fastcgi_param HTTP_AUTHORIZATION $http_authorization;
# ---------------------------------------------------------------------
