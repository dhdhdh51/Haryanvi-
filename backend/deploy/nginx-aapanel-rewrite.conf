# =====================================================================
#  Haryanvi AI — nginx rules for aaPanel / BT Panel
# ---------------------------------------------------------------------
#  WHY THIS FILE EXISTS
#  The backend ships .htaccess files, which Apache reads and nginx
#  ignores completely. On a default aaPanel site (nginx) that means:
#    * /api/* returns 404, because nothing rewrites it to index.php;
#    * database/*.sql and storage/logs/*.log are downloadable.
#  These rules replace the .htaccess behaviour.
#
#  HOW TO INSTALL
#  aaPanel → Website → your site → URL Rewrite, paste everything below,
#  Save. aaPanel writes it to
#      /www/server/panel/vhost/rewrite/<your-domain>.conf
#  and includes it inside the server block, so no `server { }` wrapper
#  belongs here.
#
#  IMPORTANT — WHY ^~ AND NOT ~
#  aaPanel includes enable-php-XX.conf (which defines `location ~ \.php$`)
#  BEFORE this rewrite file. nginx evaluates regex locations in file order
#  and the first match wins, so a plain `location ~ ^/config/` would lose
#  to the earlier `\.php$` and a file like /config/config.php would be
#  executed instead of denied. Prefix locations marked `^~` take
#  precedence over ALL regex locations, so the denials below use `^~` and
#  reliably beat the PHP handler.
# =====================================================================

# ---------------------------------------------------------------------
#  1. Deny the directories that must never be served or executed.
#     `^~` beats the `\.php$` regex handler, so even PHP files inside
#     these directories are refused rather than run.
# ---------------------------------------------------------------------
location ^~ /config/       { deny all; return 403; }
location ^~ /src/          { deny all; return 403; }
location ^~ /database/     { deny all; return 403; }
location ^~ /storage/      { deny all; return 403; }
location ^~ /bin/          { deny all; return 403; }
location ^~ /tests/        { deny all; return 403; }
location ^~ /deploy/       { deny all; return 403; }
location ^~ /admin/views/  { deny all; return 403; }

# ---------------------------------------------------------------------
#  2. Deny dumps, logs, docs and lock files by extension (defence in
#     depth; the directory rules above already cover the real secrets).
# ---------------------------------------------------------------------
location ~* \.(sql|log|md|example|bak|ini|lock|yml|yaml)$ {
    deny all;
    return 403;
}

# Dotfiles, including the now-inert .htaccess files and .git / .env.
location ~ /\.(?!well-known) {
    deny all;
    return 403;
}

# ---------------------------------------------------------------------
#  3. Route the API through the front controller.
#     index.php derives the route from REQUEST_URI, so one rewrite does
#     it. The internal redirect to /index.php is then picked up by the
#     panel's own `\.php$` handler and sent to PHP-FPM.
# ---------------------------------------------------------------------
location /api/ {
    try_files $uri /index.php$is_args$args;
}

# ---------------------------------------------------------------------
#  4. Admin dashboard. Plain prefix so /admin/index.php is still handled
#     by the PHP regex handler; the `^~ /admin/views/` rule above keeps
#     the templates unreachable.
# ---------------------------------------------------------------------
location = /admin { return 301 /admin/; }

location /admin/ {
    try_files $uri $uri/ /admin/index.php$is_args$args;
}

# ---------------------------------------------------------------------
#  5. Security headers + request cap (the API also enforces its own).
# ---------------------------------------------------------------------
add_header X-Content-Type-Options "nosniff" always;
add_header X-Frame-Options "SAMEORIGIN" always;
add_header Referrer-Policy "strict-origin-when-cross-origin" always;
fastcgi_hide_header X-Powered-By;
client_max_body_size 1m;

# ---------------------------------------------------------------------
#  NOTE ON THE Authorization HEADER
#  nginx + PHP-FPM passes it through fastcgi_params on aaPanel, so bearer
#  auth works unchanged. If every request returns UNAUTHORIZED with a
#  valid token, add inside the site's Config File .php location:
#      fastcgi_param HTTP_AUTHORIZATION $http_authorization;
# ---------------------------------------------------------------------
